name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Tests exercise the MIDI -> raw pre -> MC-constrained model path:
      # no GPU or muscriptor model download is needed.
      - name: Install CPU torch and dependencies
        run: |
          uv add --dev pytest || true
          uv sync --no-install-package muscriptor || true
          uv pip install pytest mido pynbs

      - name: Run smoke tests
        run: python -m pytest tests/ -q

      - name: Convert a synthetic MIDI end to end
        run: |
          python - <<'EOF'
          import mido
          mid = mido.MidiFile(ticks_per_beat=480)
          tr = mido.MidiTrack(); mid.tracks.append(tr)
          tr.append(mido.MetaMessage('set_tempo', tempo=500000, time=0))
          tr.append(mido.Message('note_on', channel=0, note=60, velocity=100, time=0))
          tr.append(mido.Message(
              'note_on', channel=9, note=36, velocity=100, time=240))
          mid.save('_ci.mid')
          import pynbs
          from noteblockify.mc_model import refine
          from noteblockify.song import arrange_pre

          pre = arrange_pre('_ci.mid')
          pre.save('_ci.pre.nbs')
          model = refine(pynbs.read('_ci.pre.nbs'))
          model.save('_ci.model.nbs')
          assert pre.notes, 'conversion produced no notes'
          assert len(pre.notes) == len(model.notes)
          assert all(33 <= note.key <= 57 for note in model.notes)
          print('CI conversion OK:', len(pre.notes), 'notes')
          EOF
