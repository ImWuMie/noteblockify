[project]
name = "noteblockify"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "muscriptor>=0.3.0",
    "mido>=1.3",
    "pynbs>=1.1",
]

# muscriptor pins torch<2.3 on Intel Macs. This project targets CUDA, so
# skip that environment instead of lowering the torch floor.
[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# Windows/Linux CUDA 12.8 wheels. PyPI torch on Windows is CPU-only;
# RTX 50-series needs a cu128+ build. macOS has no CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
